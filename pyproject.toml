[project]
name = "tsfm-risk"
version = "0.1.0"
description = "Do Time-Series Foundation Models Understand Financial Risk? Evaluation framework."
authors = [{ name = "Kirill Levin" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "arch>=7.0",
    "yfinance>=0.2.50",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Heavy inference stack, installed in Phase 2 (Colab/Kaggle or locally with GPU).
# lag-llama is git-only; exact pins land in Phase 2 (see PLAN.md):
#   uv pip install torch chronos-forecasting timesfm uni2ts \
#     "lag-llama @ git+https://github.com/time-series-foundation-models/lag-llama"
tsfm = [
    "torch>=2.4",
    "chronos-forecasting>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsfm_risk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
